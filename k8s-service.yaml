apiVersion: v1
kind: Service
metadata:
  name: github-code-agent-webhook
  namespace: agentfield
  labels:
    app: github-code-agent
spec:
  type: NodePort
  ports:
    - port: 8001
      targetPort: 8001
      nodePort: 30008
      protocol: TCP
      name: webhook
  selector:
    app.kubernetes.io/component: agent
    app.kubernetes.io/instance: github-code-agent
    app.kubernetes.io/name: agentfield-agent
