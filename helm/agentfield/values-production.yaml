# Production environment overrides
replicaCount: 1

controlPlane:
  image:
    pullPolicy: IfNotPresent

  service:
    nodePort: 30007

  ingress:
    host: agentfield.yongchenglow.com

  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

  env:
    - name: ENVIRONMENT
      value: "production"

  externalSecret:
    enabled: true
    name: "agentfield-secrets"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Agent workers configuration for production
agent:
  enabled: true
  replicaCount: 1

  image:
    pullPolicy: IfNotPresent

  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi

  env:
    - name: NODE_TYPE
      value: "agent"
    - name: ENVIRONMENT
      value: "production"

  externalSecret:
    enabled: true
    name: "agentfield-secrets"

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 75
