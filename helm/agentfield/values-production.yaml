# Production environment overrides
replicaCount: 1

controlPlane:
  image:
    pullPolicy: IfNotPresent

  service:
    nodePort: 30007

  ingress:
    host: agentfield.yongchenglow.com

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

  env:
    - name: AGENTFIELD_URL
      value: "http://agentfield-control-plane:8080"
    - name: PORT
      value: "8080"
    - name: ENVIRONMENT
      value: "production"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
