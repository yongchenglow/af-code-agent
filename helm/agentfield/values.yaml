# Default values for agentfield control plane
replicaCount: 1

controlPlane:
  image:
    repository: ghcr.io/yourorg/af-code-agent
    pullPolicy: IfNotPresent
    tag: "latest"

  imagePullSecrets:
    - name: ghcr-secret

  nameOverride: ""
  fullnameOverride: "agentfield-control-plane"

  service:
    type: NodePort
    port: 8080
    targetPort: 8080
    nodePort: 30007

  ingress:
    enabled: true
    className: ""
    annotations: {}
    host: agentfield.yongchenglow.com
    tls:
      enabled: false

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

  # Additional environment variables (optional)
  # These are merged with the secret
  env: []

  # External secret configuration
  # The secret should be created manually before deploying the chart
  # See secret-example.yaml for the format
  externalSecret:
    enabled: true
    name: "agentfield-secrets"

  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  # Secrets - should be provided via Kubernetes secrets
  secrets: {}
    # GITHUB_TOKEN: ""
    # GITHUB_WEBHOOK_SECRET: ""
    # AI_API_KEY: ""

  nodeSelector: {}

  tolerations: []

  affinity: {}

  podAnnotations: {}

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false

serviceAccount:
  create: true
  annotations: {}
  name: "agentfield-control-plane"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Agent configuration - worker agents that process tasks
agent:
  enabled: true
  replicaCount: 2

  image:
    repository: ghcr.io/yourorg/af-code-agent
    pullPolicy: IfNotPresent
    tag: "latest"

  imagePullSecrets:
    - name: ghcr-secret

  nameOverride: ""
  fullnameOverride: "agentfield-agent"

  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 1000m
      memory: 1Gi

  # Additional environment variables (optional)
  # These are merged with the secret
  env:
    - name: NODE_TYPE
      value: "agent"

  # External secret configuration
  # Uses the same secret as control plane
  externalSecret:
    enabled: true
    name: "agentfield-secrets"

  nodeSelector: {}

  tolerations: []

  affinity: {}

  podAnnotations: {}

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 75
