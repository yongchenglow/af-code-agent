# Default values for agentfield agents
# Note: This chart deploys agents only. The AgentField control plane
# should be deployed separately from the AgentField project.

# Service account for agents
serviceAccount:
  create: true
  annotations: {}
  name: "agentfield-agents"

# Agent configuration - worker agents that process tasks
agent:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/yongchenglow/af-code-agent
    pullPolicy: IfNotPresent
    tag: ""  # Uses Chart.AppVersion by default

  imagePullSecrets:
    - name: ghcr-secret

  nameOverride: ""
  fullnameOverride: ""

  resources:
    limits:
      cpu: 1
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi

  # Additional environment variables (optional)
  # These are merged with the secret
  env:
    - name: NODE_TYPE
      value: "agent"

  # External secret configuration
  # The secret should be created manually before deploying the chart
  # See secret-example.yaml for the format
  externalSecret:
    enabled: true
    name: "agentfield-secrets"

  nodeSelector: {}

  tolerations: []

  affinity: {}

  podAnnotations: {}

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 75
