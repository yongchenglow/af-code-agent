# Example Kubernetes Secret for AgentField
#
# This secret should be created manually in your cluster BEFORE deploying the Helm chart.
# The Helm chart will reference this secret but will NOT create it.
#
# Secret Name: agentfield-secrets
# Namespace: agentfield
#
# Usage:
# 1. Copy this file: cp secret-example.yaml secret.yaml
# 2. Replace all placeholder values with your actual credentials
# 3. Create the secret: kubectl apply -f secret.yaml
# 4. Deploy the chart: helm install agentfield ./helm/agentfield -n agentfield
#
# IMPORTANT: Never commit secret.yaml to version control!
# Add secret.yaml to .gitignore

apiVersion: v1
kind: Secret
metadata:
  name: agentfield-secrets
  namespace: agentfield
type: Opaque
stringData:
  # AgentField Configuration
  AGENTFIELD_URL: "http://agentfield-control-plane:8080"

  # GitHub Configuration
  GITHUB_TOKEN: "ghp_your_personal_access_token_here"
  GITHUB_WEBHOOK_SECRET: "your-webhook-secret-here"

  # AI Configuration
  # For DeepSeek (direct):
  AI_API_KEY: "your-deepseek-api-key-here"
  AI_BASE_URL: "https://api.deepseek.com"
  AI_MODEL: "deepseek-chat"

  # For OpenRouter (alternative - uncomment and use instead of above):
  # AI_API_KEY: "sk-or-v1-..."
  # AI_BASE_URL: "https://openrouter.ai/api/v1"
  # AI_MODEL: "deepseek/deepseek-chat"

  # Application Settings
  LOG_LEVEL: "info"
  PORT: "8080"

---
# Alternative: Create secret from .env file directly
#
# If you have a .env file with the same variables, you can create the secret like this:
#
# kubectl create secret generic agentfield-secrets \
#   --from-env-file=.env \
#   -n agentfield --dry-run=client -o yaml | kubectl apply -f -
#
# Or create from individual literals:
#
# kubectl create secret generic agentfield-secrets \
#   --from-literal=AGENTFIELD_URL="http://agentfield-control-plane:8080" \
#   --from-literal=GITHUB_TOKEN="ghp_..." \
#   --from-literal=GITHUB_WEBHOOK_SECRET="..." \
#   --from-literal=AI_API_KEY="..." \
#   --from-literal=AI_BASE_URL="https://api.deepseek.com" \
#   --from-literal=AI_MODEL="deepseek-chat" \
#   --from-literal=LOG_LEVEL="info" \
#   --from-literal=PORT="8080" \
#   -n agentfield
