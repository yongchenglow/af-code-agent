---
apiVersion: v1
kind: Service
metadata:
  name: agentfield-control-plane
  namespace: agentfield
  labels:
    app: agentfield-control-plane
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30007
      protocol: TCP
      name: http
  selector:
    app: agentfield-control-plane
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentfield-control-plane
  namespace: agentfield
  labels:
    app: agentfield-control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentfield-control-plane
  template:
    metadata:
      labels:
        app: agentfield-control-plane
    spec:
      containers:
      - name: control-plane
        image: agentfield/control-plane:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          value: "8080"
        - name: LOG_LEVEL
          value: "info"
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
